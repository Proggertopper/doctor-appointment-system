spring.application.name=doctorRegistrationSystem

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/med_schedule}
spring.datasource.username=${DATABASE_USERNAME:myuser2}
spring.datasource.password=${DATABASE_PASSWORD:hotelPassword}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


app.base-url=${APP_BASE_URL:http://localhost:8080}

turbosms.api-token=${TURBOSMS_API_TOKEN:PASTE_YOUR_CODE}
turbosms.sms-sender=${TURBOSMS_SMS_SENDER:YOUR_SMS_SENDER}
turbosms.enabled=${TURBOSMS_ENABLED:false}

doctor.admin.password-hash=${DOCTOR_ADMIN_PASSWORD_HASH:$2a$10$HosUz7WV/nArRyGJH.67jueffPye19xZHh/LjWRDxpzWpTn5HbWEq}
doctor.admin.cookie-name=${DOCTOR_ADMIN_COOKIE_NAME:DOCTOR_SESSION}
doctor.admin.session-hours=${DOCTOR_ADMIN_SESSION_HOURS:12}
doctor.admin.cookie-secure=${DOCTOR_ADMIN_COOKIE_SECURE:false}
